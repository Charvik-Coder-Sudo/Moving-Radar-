[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msdf-display"
version = "1.0.0"
description = "Live 3D / 2D / Aircraft-PPI display for the Moving Radar multi-sensor data fusion project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - internal project use" }

# Kept in step with requirements.txt, which is what the setup scripts install.
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyqtgraph>=0.13",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
]

[project.scripts]
msdf-display = "launcher:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
# The application is run from its own folder rather than installed into site-packages;
# these are listed so that `pip install -e .` also works for development.
packages = [
    "config", "data_loader", "models", "msdf_math", "processing", "rdp", "visualization", "widgets",
]
py-modules = ["main", "launcher", "paths", "environment", "logging_setup", "verify_installation"]

[tool.setuptools.package-data]
config = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
